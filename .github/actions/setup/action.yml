# The repo's pinned toolchain in one place — workflows use this instead of
# repeating nodeVersion/packageManagerVersion in every job.
name: repo setup
description: Node + pnpm environment with the repo's pinned versions
runs:
  using: composite
  steps:
    - uses: the-guild-org/shared-config/setup@1c4632ccc198d4c9b34d9e6b3d556c6f245b4e69 # main
      with:
        nodeVersion: 26.8.1
        packageManager: pnpm
        packageManagerVersion: 11.25.0
