name: product-docs-preview

# Builds the site with the docs content from a PR of one of the registry
# products (src/products/<slug>) and deploys it as a Pages preview at
# https://<slug>-pr-<n>.guild-dev-website.pages.dev.
# Fired by that product repo's docs-preview workflow (repository_dispatch
# with client_payload {product, pr}), or by hand (workflow_dispatch).

on:
  repository_dispatch:
    types:
      - product-docs-preview
  workflow_dispatch:
    inputs:
      product:
        description: Product slug (a folder under website/src/products)
        required: true
      pr:
        description: PR number in that product's repository
        required: true

concurrency:
  group:
    product-docs-preview-${{ github.event.client_payload.product || inputs.product }}-${{
    github.event.client_payload.pr || inputs.pr }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCS_PREVIEW_PRODUCT: ${{ github.event.client_payload.product || inputs.product }}
      DOCS_PREVIEW_PR: ${{ github.event.client_payload.pr || inputs.pr }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # PR content is rendered during the build; keep the token out of .git/config.
          persist-credentials: false

      - name: cache playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: cache astro image optimization
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: website/node_modules/.astro
          key: ${{ runner.os }}-astro-assets-${{ env.DOCS_PREVIEW_PRODUCT }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-assets-

      - uses: ./.github/actions/setup
        name: setup env

      - name: validate the request
        run: |
          [[ "$DOCS_PREVIEW_PR" =~ ^[0-9]+$ ]] || { echo "PR must be numeric, got: $DOCS_PREVIEW_PR"; exit 1; }
          [[ "$DOCS_PREVIEW_PRODUCT" =~ ^[a-z0-9-]+$ && -f "website/src/products/$DOCS_PREVIEW_PRODUCT/product.ts" ]] \
            || { echo "unknown product: $DOCS_PREVIEW_PRODUCT"; exit 1; }

      - name: build with PR content
        env:
          DOCS_PREVIEW_REF: refs/pull/${{ env.DOCS_PREVIEW_PR }}/head
        run: pnpm --filter website build

      - name: deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler pages deploy website/dist --project-name=guild-dev-website --branch=${{
          env.DOCS_PREVIEW_PRODUCT }}-pr-${{ env.DOCS_PREVIEW_PR }}
