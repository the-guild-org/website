name: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  # Fired by dotansimha/graphql-code-generator, graphql-hive/graphql-yoga (Yoga
  # and Envelop docs), ardatan/graphql-mesh and graphql-hive/graphql-inspector when
  # their docs content changes — the build fetches that content, so a redeploy picks it up.
  repository_dispatch:
    types:
      - codegen-content-update
      - yoga-content-update
      - inspector-content-update
      # Any registry product (src/products/<slug>), sent by its notify-website workflow.
      - product-content-update
      - mesh-content-update

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The Mermaid renderer downloads Chromium in postinstall; the image
      # service re-optimizes every asset on a cold cache. Both are restored
      # here (before setup runs pnpm install).
      - name: cache playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: cache astro image optimization
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/node_modules/.astro
          key: ${{ runner.os }}-astro-assets-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-assets-

      # The plugin hubs' npm metadata (scripts/lib/npm-info.ts) is reused for a
      # day; the date in the key rolls the cache over once a day.
      - name: npm metadata cache key
        id: npm-info
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: cache npm metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/.cache/npm-info
          key: ${{ runner.os }}-npm-info-${{ steps.npm-info.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-npm-info-

      - uses: ./.github/actions/setup
        name: setup env

      - uses: the-guild-org/shared-config/website-cf@main
        name: build and deploy website
        with:
          cloudflareApiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflareAccountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          projectName: guild-dev-website
          prId: ${{ github.event.pull_request.number }}
          websiteDirectory: website
          buildScript: pnpm build
          artifactDir: dist

  prettier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        name: setup env

      - name: prettier:check
        run: 'pnpm prettier:check'

  router-typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        name: setup env

      - name: typecheck
        run: pnpm --filter guild-website-router typecheck

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The type check imports the fetched content and generated data, so the
      # fetch runs here too; with the npm metadata cache warm it takes seconds.
      - name: npm metadata cache key
        id: npm-info
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: cache npm metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/.cache/npm-info
          key: ${{ runner.os }}-npm-info-test-${{ steps.npm-info.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-npm-info-

      - uses: ./.github/actions/setup
        name: setup env

      - name: router tests
        run: pnpm --filter guild-website-router test

      - name: website tests
        run: pnpm --filter website test

      # Type-checks the Astro sources; off the deploy path so the build ships sooner.
      - name: fetch website content
        run: pnpm --filter website run fetch-all

      - name: website typecheck
        run: pnpm --filter website check

      - name: helper worker typecheck
        run: pnpm --filter website-helper-worker typecheck

  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cache playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: cache astro image optimization
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/node_modules/.astro
          key: ${{ runner.os }}-astro-assets-lh-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-assets-

      # The plugin hubs' npm metadata (scripts/lib/npm-info.ts) is reused for a
      # day; the date in the key rolls the cache over once a day.
      - name: npm metadata cache key
        id: npm-info
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: cache npm metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/.cache/npm-info
          key: ${{ runner.os }}-npm-info-lh-${{ steps.npm-info.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-npm-info-

      - uses: ./.github/actions/setup
        name: setup env

      - name: build
        run: pnpm --filter website build

      # lhci runs directly (no third-party action; the org's Actions policy
      # only allows selected creators). autorun = collect + assert.
      - name: lighthouse budgets
        run: pnpm exec lhci autorun --config=.lighthouserc.json

      - name: upload lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci
          # dotfolders are excluded by default since upload-artifact v4.4
          include-hidden-files: true
          retention-days: 14
