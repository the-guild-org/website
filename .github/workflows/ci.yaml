name: ci

on:
  pull_request:
    branches:
      - master
      - feat-guild-redesign
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The Mermaid renderer downloads Chromium in postinstall; the image
      # service re-optimizes every asset on a cold cache. Both are restored
      # here (before setup runs pnpm install).
      - name: cache playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: cache astro image optimization
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: website/node_modules/.astro
          key: ${{ runner.os }}-astro-assets-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-assets-

      - uses: the-guild-org/shared-config/setup@main
        name: setup env
        with:
          nodeVersion: 26.8.1
          packageManager: pnpm
          packageManagerVersion: 11.25.0

      - uses: the-guild-org/shared-config/website-cf@main
        name: build and deploy website
        with:
          cloudflareApiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflareAccountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          projectName: guild-dev-website
          prId: ${{ github.event.pull_request.number }}
          websiteDirectory: website
          buildScript: pnpm build
          artifactDir: dist

  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: the-guild-org/shared-config/setup@main
        name: setup env
        with:
          nodeVersion: 26.8.1
          packageManager: pnpm
          packageManagerVersion: 11.25.0

      - name: prettier:check
        run: 'pnpm prettier:check'

  router-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: the-guild-org/shared-config/setup@main
        name: setup env
        with:
          nodeVersion: 26.8.1
          packageManager: pnpm
          packageManagerVersion: 11.25.0

      - name: typecheck
        run: pnpm --filter guild-website-router typecheck
