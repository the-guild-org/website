name: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  # Fired by dotansimha/graphql-code-generator, graphql-hive/graphql-yoga (Yoga
  # and Envelop docs), ardatan/graphql-mesh and graphql-hive/graphql-inspector when
  # their docs content changes — the build fetches that content, so a redeploy picks it up.
  repository_dispatch:
    types:
      - codegen-content-update
      - yoga-content-update
      - inspector-content-update
      # Any registry product (src/products/<slug>), sent by its notify-website workflow.
      - product-content-update
      - mesh-content-update

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the preview comment.
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The Mermaid renderer downloads Chromium in postinstall; the image
      # service re-optimizes every asset on a cold cache. Both are restored
      # here (before setup runs pnpm install).
      - name: cache playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: cache astro image optimization
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/node_modules/.astro
          key: ${{ runner.os }}-astro-assets-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-assets-

      # The plugin hubs' npm metadata (scripts/lib/npm-info.ts) is reused for a
      # day; the date in the key rolls the cache over once a day.
      - name: npm metadata cache key
        id: npm-info
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: cache npm metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/.cache/npm-info
          key: ${{ runner.os }}-npm-info-${{ steps.npm-info.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-npm-info-

      - uses: ./.github/actions/setup
        name: setup env

      - name: build website
        env:
          # Matches the --branch flag passed to wrangler below, so a preview
          # build's canonical/OG URLs, sitemaps, and JSON-LD point at the
          # preview host they're actually served from instead of prod.
          SITE_URL:
            ${{ github.event_name == 'pull_request' &&
            format('https://pr-{0}.guild-dev-website.pages.dev', github.event.pull_request.number)
            || '' }}
        run: pnpm --filter website build

      # A pull request deploys to its own preview branch (pr-<n>); a push to
      # master or a content dispatch deploys the checked-out branch, which is
      # the project's production branch.
      - name: deploy to cloudflare pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          BRANCH_FLAG:
            ${{ github.event_name == 'pull_request' && format('--branch=pr-{0}',
            github.event.pull_request.number) || '' }}
        run: |
          pnpm exec wrangler pages deploy website/dist --project-name=guild-dev-website $BRANCH_FLAG
          echo "alias=$(jq -r 'select(.type == "pages-deploy-detailed") | .alias' "$WRANGLER_OUTPUT_FILE_PATH")" >> "$GITHUB_OUTPUT"

      # One comment per pull request, updated on every push (the marker finds it).
      - name: comment the preview url on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.alias }}
        run: |
          body="$(printf '<!--- website_deployment --->\n### 💻 Website Preview\n\nThe latest changes are available as preview in: [%s](%s)' "$URL" "$URL")"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!--- website_deployment --->"))) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        name: setup env

      - name: eslint
        run: pnpm lint

  prettier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        name: setup env

      - name: prettier:check
        run: 'pnpm prettier:check'

  router-typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        name: setup env

      - name: typecheck
        run: pnpm --filter guild-website-router typecheck

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The type check imports the fetched content and generated data, so the
      # fetch runs here too; with the npm metadata cache warm it takes seconds.
      - name: npm metadata cache key
        id: npm-info
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: cache npm metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/.cache/npm-info
          key: ${{ runner.os }}-npm-info-test-${{ steps.npm-info.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-npm-info-

      - uses: ./.github/actions/setup
        name: setup env

      - name: router tests
        run: pnpm --filter guild-website-router test

      - name: website tests
        run: pnpm --filter website test

      # Type-checks the Astro sources; off the deploy path so the build ships sooner.
      - name: fetch website content
        run: pnpm --filter website run fetch-all

      - name: website typecheck
        run: pnpm --filter website check

      - name: helper worker typecheck
        run: pnpm --filter website-helper-worker typecheck

  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cache playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: cache astro image optimization
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/node_modules/.astro
          key: ${{ runner.os }}-astro-assets-lh-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-assets-

      # The plugin hubs' npm metadata (scripts/lib/npm-info.ts) is reused for a
      # day; the date in the key rolls the cache over once a day.
      - name: npm metadata cache key
        id: npm-info
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: cache npm metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/.cache/npm-info
          key: ${{ runner.os }}-npm-info-lh-${{ steps.npm-info.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-npm-info-

      - uses: ./.github/actions/setup
        name: setup env

      - name: build
        run: pnpm --filter website build

      # lhci runs directly (no third-party action; the org's Actions policy
      # only allows selected creators). autorun = collect + assert.
      - name: lighthouse budgets
        run: pnpm exec lhci autorun --config=.lighthouserc.json

      - name: upload lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci
          # dotfolders are excluded by default since upload-artifact v4.4
          include-hidden-files: true
          retention-days: 14
