name: codegen-docs-preview

# Builds the site with the docs content from a graphql-code-generator PR and
# deploys it as a Pages preview at
# https://codegen-pr-<n>.guild-dev-website.pages.dev.
# Fired by that repo's docs-preview workflow (repository_dispatch), or by
# hand with a PR number (workflow_dispatch).

on:
  repository_dispatch:
    types:
      - codegen-docs-preview
  workflow_dispatch:
    inputs:
      pr:
        description: graphql-code-generator PR number
        required: true

concurrency:
  group: codegen-docs-preview-${{ github.event.client_payload.pr || inputs.pr }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODEGEN_PR: ${{ github.event.client_payload.pr || inputs.pr }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: cache playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: cache astro image optimization
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/node_modules/.astro
          key: ${{ runner.os }}-astro-assets-codegen-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-assets-

      - uses: ./.github/actions/setup
        name: setup env

      - name: build with PR content
        env:
          CODEGEN_REPO_REF: refs/pull/${{ env.CODEGEN_PR }}/head
        run: pnpm --filter website build

      - name: deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler pages deploy website/dist --project-name=guild-dev-website
          --branch=codegen-pr-${{ env.CODEGEN_PR }}
