<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1440"
  height="1160"
  viewBox="0 0 1440 1160"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Configure the external fragment loader and find missing fragments</title>
  <desc id="description">
    Set packageDir to the current package with missing fragments, and externalPackagesDirs to
    folders containing dependency packages. FragmentA is missing from the current package, so the
    loader reads package.json. A direct dependency contains FragmentA, but it refers to FragmentB,
    which is still missing. The loader reads the dependency's package.json and finds FragmentB in a
    transitive dependency. FragmentA and FragmentB are returned in the result. All fragment names
    are fictional.
  </desc>
  <defs>
    <marker
      id="arrow"
      markerWidth="16"
      markerHeight="16"
      refX="13"
      refY="8"
      orient="auto"
      markerUnits="userSpaceOnUse"
    >
      <path
        d="M3 3 13 8 3 13"
        fill="none"
        stroke="#245850"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </marker>
    <g id="missing-icon">
      <circle r="13" fill="#fff0e8" stroke="#932d47" stroke-width="2" />
      <path
        d="M-4.5 -4.5 4.5 4.5 M4.5 -4.5 -4.5 4.5"
        fill="none"
        stroke="#932d47"
        stroke-width="2.3"
        stroke-linecap="round"
      />
    </g>
    <g id="check-icon">
      <path
        d="M-10 0 -2 8 12 -6"
        fill="none"
        stroke="#245850"
        stroke-width="3.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
    <style>
      text {
        font-family: Arial, Helvetica, sans-serif;
        fill: #00342c;
      }
      .mono {
        font-family: Menlo, Consolas, monospace;
      }
      .muted {
        fill: #3b736a;
      }
      .label {
        font-size: 32px;
        font-weight: 700;
        fill: #3b736a;
      }
      .heading {
        font-size: 38px;
        font-weight: 700;
      }
      .status {
        font-size: 32px;
        font-weight: 700;
      }
      .detail {
        font-size: 32px;
        fill: #3b736a;
      }
      .step {
        font-size: 28px;
        font-weight: 700;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect width="1440" height="1160" fill="#f8f7f6" />
  <rect width="1440" height="8" fill="#e1ff00" />
  <text x="64" y="62" class="mono muted" font-size="30">
    @graphql-tools/external-fragment-loader
  </text>
  <text x="64" y="128" font-size="56" font-weight="700">Resolve fragments across packages</text>

  <!-- 1. Configure the loader. -->
  <rect
    x="64"
    y="170"
    width="1312"
    height="286"
    rx="16"
    fill="#ffffff"
    stroke="#dedacf"
    stroke-width="1.5"
  />
  <circle cx="100" cy="212" r="24" fill="#00342c" />
  <text x="100" y="222" class="step" style="fill: #ffffff">1</text>
  <text x="140" y="225" class="heading">Configure the new loader</text>
  <path d="M720 257 V424" stroke="#dedacf" stroke-width="1.5" />
  <text x="96" y="279" font-size="32" font-weight="700">Current package</text>
  <text x="96" y="321" font-size="30" class="muted">The package with missing fragments</text>
  <text x="96" y="364" class="mono" font-size="30">packageDir:</text>
  <text x="96" y="408" class="mono" font-size="32">'/repo/packages/my-app'</text>
  <text x="752" y="279" font-size="32" font-weight="700">Dependency packages</text>
  <text x="752" y="321" font-size="30" class="muted">Folders containing dependency packages</text>
  <text x="752" y="364" class="mono" font-size="30">externalPackagesDirs:</text>
  <text x="752" y="408" class="mono" font-size="32">['/repo/packages']</text>

  <!-- 2. Look up each missing fragment. -->
  <circle cx="88" cy="508" r="24" fill="#00342c" />
  <text x="88" y="518" class="step" style="fill: #ffffff">2</text>
  <text x="128" y="521" class="heading">Find missing fragments</text>

  <rect
    x="64"
    y="556"
    width="360"
    height="296"
    rx="14"
    fill="#ffffff"
    stroke="#dedacf"
    stroke-width="1.5"
  />
  <text x="88" y="604" class="label">Current package</text>
  <use href="#missing-icon" x="104" y="689" />
  <text x="132" y="698" class="status" style="fill: #932d47">
    <tspan x="132">Missing fragment</tspan>
    <tspan x="132" dy="40">FragmentA</tspan>
  </text>
  <text x="88" y="812" class="detail">Read package.json</text>

  <path d="M436 704 H476" fill="none" stroke="#245850" stroke-width="3" marker-end="url(#arrow)" />

  <rect
    x="488"
    y="556"
    width="496"
    height="296"
    rx="14"
    fill="#ffffff"
    stroke="#dedacf"
    stroke-width="1.5"
  />
  <text x="512" y="604" class="label">Direct dependencies</text>
  <use href="#check-icon" x="524" y="661" />
  <text x="554" y="672" class="status">Fragment found</text>
  <use href="#missing-icon" x="524" y="714" />
  <text x="554" y="725" class="status" style="fill: #932d47">
    <tspan x="554">But it refers to FragmentB,</tspan>
    <tspan x="554" dy="40">which is missing</tspan>
  </text>
  <text x="512" y="812" class="detail">Read package.json</text>

  <path d="M996 704 H1036" fill="none" stroke="#245850" stroke-width="3" marker-end="url(#arrow)" />

  <rect
    x="1048"
    y="556"
    width="328"
    height="296"
    rx="14"
    fill="#ecf6f3"
    stroke="#8cbeb3"
    stroke-width="1.5"
  />
  <text x="1072" y="604" class="label">
    <tspan x="1072">Transitive</tspan>
    <tspan x="1072" dy="40">dependencies</tspan>
  </text>
  <use href="#check-icon" x="1084" y="723" />
  <text x="1114" y="732" class="status">Fragment found</text>

  <path d="M1212 868 V914" fill="none" stroke="#245850" stroke-width="3" marker-end="url(#arrow)" />

  <!-- 3. Collect the required external fragments. -->
  <rect x="64" y="930" width="1312" height="180" rx="16" fill="#00342c" />
  <circle cx="100" cy="969" r="24" fill="#e1ff00" />
  <text x="100" y="979" class="step">3</text>
  <text x="140" y="982" class="heading" style="fill: #ffffff">
    Return required external fragments
  </text>
  <rect x="96" y="1008" width="608" height="70" rx="8" fill="#ecf6f3" />
  <use href="#check-icon" x="128" y="1041" />
  <text x="160" y="1055" class="mono" font-size="34" font-weight="700">FragmentA</text>
  <rect x="728" y="1008" width="616" height="70" rx="8" fill="#ecf6f3" />
  <use href="#check-icon" x="760" y="1041" />
  <text x="792" y="1055" class="mono" font-size="34" font-weight="700">FragmentB</text>
</svg>
