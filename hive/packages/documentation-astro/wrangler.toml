name = "hive-platform-docs-astro"
compatibility_date = "2026-08-14"
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
not_found_handling = "404-page"
# Keep the old site's URL shape: pages live at /path, not /path/. The default
# (auto-trailing-slash) would 307-redirect every existing slash-less deep link.
html_handling = "drop-trailing-slash"
